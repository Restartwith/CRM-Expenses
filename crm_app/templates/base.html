<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}CRM{% endblock %}</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      nav { margin-bottom: 1.5rem; }
      nav a { margin-right: 1rem; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
      form label { display: block; margin-top: 0.75rem; }
      input { padding: 0.4rem; width: 250px; }
      button { margin-top: 1rem; padding: 0.5rem 1rem; }
    </style>
  </head>
  <body>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/create-lead">Create Lead</a>
      <a href="/leads">Leads</a>
      <a href="/create-contact">Create Contact</a>
      <a href="/contacts">Contacts</a>
      <a href="/create-deal">Create Deal</a>
      <a href="/deals">Deals</a>
      <a href="/reports">Reports</a>
      <a href="/api/docs/ui">API Docs</a>
      {% if current_user.is_authenticated %}
        <a href="/logout">Logout</a>
      {% else %}
        <a href="/login">Login</a>
      {% endif %}
    </nav>

    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
