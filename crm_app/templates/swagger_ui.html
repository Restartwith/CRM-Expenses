<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>CRM API Docs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.19.0/swagger-ui.css" integrity="sha512-nEKZ4tKE0kJxD9Q4VmvulZjSDkq2Yx42RiP0QY6RBc5E8Fz6YkG7h/0jOjxCcE6E8oBHXgU5v+q8U4EZxPKqDg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      body { margin: 0; padding: 0; }
      #swagger-ui { width: 100%; height: 100vh; }
    </style>
  </head>
  <body>
    <div style="padding: 1rem; background: #f5f5f5; border-bottom: 1px solid #ddd;">
      <a href="/api/docs" style="font-weight: 600; color: #0d6efd; text-decoration: none;">View raw API docs</a>
      <span style="margin-left: 1rem; color: #555;">(JSON docs available at <code>/api/openapi.json</code>)</span>
    </div>
    <div id="swagger-ui"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.19.0/swagger-ui-bundle.min.js" integrity="sha512-qsresOqYvt26a/CzBH+W9/o2pSOQkWHiLFPnBu7Q72Ue7omDGFh3YFBgOK7UihI2tCUKGKHzkoNnDEpqNLxWDw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
      window.onload = function() {
        const ui = SwaggerUIBundle({
          url: '/api/openapi.json',
          dom_id: '#swagger-ui',
          presets: [SwaggerUIBundle.presets.apis],
          layout: 'BaseLayout',
          docExpansion: 'none'
        });
      };
    </script>
  </body>
</html>
