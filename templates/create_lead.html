{% extends "base.html" %}

{% block title %}Create Lead{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb breadcrumb-small mb-3">
            <li class="breadcrumb-item"><a href="/">🏠 Dashboard</a></li>
            <li class="breadcrumb-item"><a href="/leads">📋 Leads</a></li>
            <li class="breadcrumb-item active" aria-current="page">➕ Create Lead</li>
          </ol>
        </nav>
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <h2 class="card-title mb-1">Create Lead</h2>
            <p class="text-muted mb-0">Add a new lead to your CRM pipeline.</p>
          </div>
          <a href="/leads" class="btn btn-secondary">Back to Leads</a>
        </div>
        <form method="post" action="/create-lead">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email">
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="phone" name="phone">
          </div>
          <div class="mb-3">
            <label for="company" class="form-label">Company</label>
            <input type="text" class="form-control" id="company" name="company">
          </div>
          <button type="submit" class="btn btn-primary w-100">Save Lead</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
