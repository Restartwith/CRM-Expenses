{% extends "base.html" %}

{% block title %}Create Deal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb breadcrumb-small mb-3">
            <li class="breadcrumb-item"><a href="/">🏠 Dashboard</a></li>
            <li class="breadcrumb-item"><a href="/deals">💼 Deals</a></li>
            <li class="breadcrumb-item active" aria-current="page">➕ Create Deal</li>
          </ol>
        </nav>
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <h2 class="card-title mb-1">Create Deal</h2>
            <p class="text-muted mb-0">Add a new deal to your sales pipeline.</p>
          </div>
          <a href="/deals" class="btn btn-secondary">Back to Deals</a>
        </div>
}]}        <form method="post" action="/create-deal">
          <div class="mb-3">
            <label for="deal_name" class="form-label">Deal Name</label>
            <input type="text" class="form-control" id="deal_name" name="deal_name" required>
          </div>
          <div class="mb-3">
            <label for="amount" class="form-label">Amount</label>
            <input type="number" step="0.01" class="form-control" id="amount" name="amount">
          </div>
          <div class="mb-3">
            <label for="stage" class="form-label">Stage</label>
            <input type="text" class="form-control" id="stage" name="stage">
          </div>
          <button type="submit" class="btn btn-primary w-100">Save Deal</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
